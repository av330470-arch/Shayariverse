name: shayari_verse
description: Instagram style ai shayari and Reels app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # Image & Video
  image_picker: ^1.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1

  # AI (Gemini)
  google_generative_ai: ^0.4.6

  # Ads
  google_mobile_ads: ^5.2.0

  # Utilities
  permission_handler: ^11.3.1
  share_plus: ^10.0.3
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/
